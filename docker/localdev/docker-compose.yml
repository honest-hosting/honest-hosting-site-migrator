    profiles: [php83, all]

  # ----------------------------------------------------------------------------- PHP 8.4
  db-84:
    <<: *db-common
    container_name: hh-migrator-db-84
    ports: ["30084:3306"]
    profiles: [php84, all]

  wp-84:
    <<: *wp-common
    build:
      context: ../..
